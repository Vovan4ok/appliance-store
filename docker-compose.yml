services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appliance_store}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appliance_store}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    # Append-only file: revoked tokens survive a Redis restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
      # Management port (/actuator/health, /actuator/prometheus): this machine only, never the network
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appliance_store}
      DB_USERNAME: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      UPLOAD_DIR: /app/uploads
      # Mailpit by default; set the MAIL_* values in .env to send real email through Brevo instead
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@appliance-store.com}
      # With real SMTP: deliver everything to one inbox (sample accounts use strangers' real-looking addresses).
      # Defaults to your MAIL_FROM sender once you set one in .env; opt out explicitly with an empty MAIL_REDIRECT_TO=
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO-${MAIL_FROM:-}}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_HOST: redis
      TEMPORAL_ADDRESS: temporal:7233
      # How long a submitted order waits before employees get a reminder / before it goes back to the cart
      ORDER_APPROVAL_REMINDER_AFTER: ${ORDER_APPROVAL_REMINDER_AFTER:-24h}
      ORDER_APPROVAL_EXPIRE_AFTER: ${ORDER_APPROVAL_EXPIRE_AFTER:-72h}
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── Temporal: runs the order-approval workflows (durable reminder and expiry timers) ──
  # The single-binary dev server (SQLite file in a volume) with its Web UI; production would run a Temporal
  # cluster or Temporal Cloud instead, the app only needs TEMPORAL_ADDRESS
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"   # gRPC API (the app connects here inside the Docker network)
      - "127.0.0.1:8233:8233"   # Web UI: every order's workflow, its timers and history
    volumes:
      # The image runs as user "temporal": its home directory gives the new volume the right owner
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Observability: Prometheus collects the app's metrics, Grafana shows them ──
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Open the store dashboard right after login
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/appliance-store.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  prometheus_data:
  grafana_data:
  temporal_data: