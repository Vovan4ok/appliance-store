spring.application.name=appliance-store
server.port=8080

spring.profiles.active=dev

spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
# Fall back to messages.properties (English), not the JVM locale - otherwise ?lang=en shows Ukrainian on uk-UA machines
spring.messages.fallback-to-system-locale=false

spring.jpa.open-in-view=false

# No default on purpose: prod refuses to start without JWT_SECRET (dev/test profiles define a local-only secret)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# ── Email notifications ──
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@appliance-store.com}

# ── AI description generator (Spring AI + OpenAI) ──
# Off unless AI_CHAT_PROVIDER=openai. The key comes only from the environment, never from the repo.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# Fail fast and retry once (handled by the OpenAI SDK), then fall back to the existing description
spring.ai.openai.timeout=15s
spring.ai.openai.max-retries=1
# Pin the model: the default can change between Spring AI versions
spring.ai.openai.chat.model=gpt-5-mini
# gpt-5-mini is a reasoning model and hidden reasoning tokens count against the cap below:
# keep reasoning minimal so the budget is spent on the answer (with 300 tokens and default effort it returned nothing)
spring.ai.openai.chat.reasoning-effort=minimal
# Caps cost and output length (Ukrainian needs more tokens per sentence than English)
spring.ai.openai.chat.max-completion-tokens=500
# Only chat is used: keep the other OpenAI models off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ── Redis: JWT logout deny-list, AI description cache, AI rate limit ──
# Off by default: dev/test use in-memory fallbacks, so no Docker is needed. The prod profile turns it on.
app.redis.enabled=false
spring.cache.type=simple
spring.cache.cache-names=aiDescriptions
# AI calls allowed per employee per minute
app.ai.rate-limit.per-minute=10

# ── Health check: only /actuator/health is exposed (shows component status, no details) ──
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.health.redis.enabled=${app.redis.enabled}
# Mail is best-effort (async, failures are swallowed), so it must not make the app look DOWN
management.health.mail.enabled=false
