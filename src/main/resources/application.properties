spring.application.name=appliance-store
server.port=8080

spring.profiles.active=dev

spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
# Fall back to messages.properties (English), not the JVM locale - otherwise ?lang=en shows Ukrainian on uk-UA machines
spring.messages.fallback-to-system-locale=false

spring.jpa.open-in-view=false

# No default on purpose: prod refuses to start without JWT_SECRET (dev/test profiles define a local-only secret)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# ── Email notifications ──
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@appliance-store.com}

# ── AI description generator (Spring AI + OpenAI) ──
# Off unless AI_CHAT_PROVIDER=openai. The key comes only from the environment, never from the repo.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# Fail fast and retry once (handled by the OpenAI SDK), then fall back to the existing description
spring.ai.openai.timeout=15s
spring.ai.openai.max-retries=1
# Pin the model: the default can change between Spring AI versions
spring.ai.openai.chat.model=gpt-5-mini
# gpt-5-mini is a reasoning model and hidden reasoning tokens count against the cap below:
# keep reasoning minimal so the budget is spent on the answer (with 300 tokens and default effort it returned nothing)
spring.ai.openai.chat.reasoning-effort=minimal
# Caps cost and output length (Ukrainian needs more tokens per sentence than English)
spring.ai.openai.chat.max-completion-tokens=500
# Only chat is used: keep the other OpenAI models off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ── Redis: JWT logout deny-list, AI description cache, rate limits ──
# Off by default: dev/test use in-memory fallbacks, so no Docker is needed. The prod profile turns it on.
app.redis.enabled=false
spring.cache.type=simple
spring.cache.cache-names=aiDescriptions
# AI calls allowed per employee per minute
app.ai.rate-limit.per-minute=10

# ── Recommendations (public endpoint for the embeddable widget) ──
# Calls allowed per IP address per minute (a page with the widget makes one call per view)
app.recommendations.rate-limit.per-minute=${RECOMMENDATIONS_RATE_LIMIT:60}
# Websites whose pages may call it from the browser: * = any, or a comma-separated list such as
# https://shop.example.com,https://*.example.org
app.widget.allowed-origins=${WIDGET_ALLOWED_ORIGINS:*}

# ── Order approval (Temporal) ──
# Off by default: dev/test approve orders directly, so no Temporal server is needed. The prod profile turns it on.
app.temporal.enabled=false
app.temporal.target=${TEMPORAL_ADDRESS:localhost:7233}
app.temporal.namespace=${TEMPORAL_NAMESPACE:default}
# false = this instance only starts/approves workflows (web role on Cloud Run); another instance runs the worker
app.temporal.worker.enabled=${TEMPORAL_WORKER_ENABLED:true}
# A pending order nobody approves: employees get a reminder, later it goes back to the client's cart
app.orders.approval.reminder-after=${ORDER_APPROVAL_REMINDER_AFTER:24h}
app.orders.approval.expire-after=${ORDER_APPROVAL_EXPIRE_AFTER:72h}

# ── Actuator: health check + Prometheus metrics, nothing else ──
# The prod profile moves both to a separate management port that is not published to the internet
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-components=always
# Every metric gets an application label, so several apps can share one Prometheus
management.metrics.tags.application=${spring.application.name}
# Histogram buckets for request latency, so Grafana can compute p95/p99 across instances
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.health.redis.enabled=${app.redis.enabled}
# Mail is best-effort (async, failures are swallowed), so it must not make the app look DOWN
management.health.mail.enabled=false

# Demo safety: send EVERY email to this one address (the original recipient goes into the subject).
# The sample accounts use real-looking addresses (e.g. phobos@gmail.com) that belong to strangers:
# set this whenever a real SMTP server (Brevo) is used with the sample data
app.mail.redirect-to=${MAIL_REDIRECT_TO:}
