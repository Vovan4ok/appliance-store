# ── GCP profile (used together with prod: SPRING_PROFILES_ACTIVE=prod,gcp) ──
# Google Managed Prometheus bills per ingested sample, so only the metrics the Cloud Monitoring dashboard and the
# alerts use are exported. HTTP traffic, latency and errors come from Cloud Run's own (free) request metrics, so the
# app's per-URI latency histograms (dozens of buckets per endpoint) are not needed here.
management.metrics.enable.all=false
# Business metrics (orders, AI, logins, rate limit, pending orders, out-of-stock)
management.metrics.enable.store=true
# JVM and process
management.metrics.enable.jvm.memory.used=true
management.metrics.enable.jvm.memory.max=true
management.metrics.enable.process.cpu.usage=true
# Database connection pool
management.metrics.enable.hikaricp.connections.active=true
management.metrics.enable.hikaricp.connections.pending=true
management.metrics.enable.hikaricp.connections.max=true
# OpenAI calls and token usage (Spring AI)
management.metrics.enable.gen_ai.client.token.usage=true
management.metrics.enable.gen_ai.client.operation=true
# Averages from _sum/_count are enough in the cloud: no histogram buckets
management.metrics.distribution.percentiles-histogram.http.server.requests=false
management.metrics.distribution.percentiles-histogram.store.ai.descriptions=false
