# ── Prod profile: PostgreSQL + Flyway migrations ──

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.com.vovan4ok=INFO
logging.level.root=WARN

# ── SMTP ──
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ── Redis: shared deny-list, cache and rate limit across app instances ──
app.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Short timeouts: Redis is local and fast; when it is slow or gone, the fallbacks are better than waiting
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.cache.type=redis
# AI texts are keyed by a hash of the product data, so a long TTL never serves stale text
spring.cache.redis.time-to-live=7d
spring.cache.redis.cache-null-values=false
