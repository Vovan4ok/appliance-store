# ── Prod profile: PostgreSQL + Flyway migrations ──

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.com.vovan4ok=INFO
logging.level.root=WARN

# ── SMTP ──
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# Fail after a few seconds instead of hanging forever (JavaMail default: no timeout) when the SMTP server is unreachable
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ── Redis: shared deny-list, cache and rate limit across app instances ──
app.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Short timeouts: Redis is local and fast; when it is slow or gone, the fallbacks are better than waiting
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.cache.type=redis
# AI texts are keyed by a hash of the product data, so a long TTL never serves stale text
spring.cache.redis.time-to-live=7d
spring.cache.redis.cache-null-values=false

# ── Actuator on its own port: /actuator/health and /actuator/prometheus are served only on 8081,
# which docker-compose publishes on localhost only (Prometheus scrapes it inside the Docker network); 8080 has no
# actuator endpoints at all
management.server.port=${MANAGEMENT_PORT:8081}

# ── Order approval runs as a Temporal workflow (reminder + expiry timers survive restarts) ──
app.temporal.enabled=true

# ── Running behind a proxy / in the cloud (all off locally, set by the deployment) ──
# Mark the JWT cookie Secure (only sent over HTTPS)
app.security.cookie-secure=${COOKIE_SECURE:false}
# Behind Cloud Run's HTTPS front end: trust X-Forwarded-Proto/Host so generated URLs (e.g. Swagger) use https
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Small managed databases allow few connections: web instances x pool size + worker must stay below the limit
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Redis on a shared network gets a password (empty = none, as in docker compose)
spring.data.redis.password=${REDIS_PASSWORD:}
