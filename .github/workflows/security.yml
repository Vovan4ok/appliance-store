name: Security

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # New CVEs are published every day, so scan weekly even when the code doesn't change
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload findings to the repository's Security tab
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Dependency-Check 13 requires an NVD API key; without the secret (forks, Dependabot PRs) skip instead of failing
      - name: Check NVD API key
        if: env.NVD_API_KEY == ''
        run: echo "::warning title=Dependency scan skipped::Add the NVD_API_KEY repository secret to enable OWASP Dependency-Check"

      # The vulnerability database is large; restore the newest copy so only changes are downloaded
      - name: Restore vulnerability database
        if: env.NVD_API_KEY != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.dependency-check/data
          key: dependency-check-db-${{ github.run_id }}
          restore-keys: dependency-check-db-

      - name: Scan dependencies (fails on CVSS >= 7)
        id: scan
        if: env.NVD_API_KEY != ''
        run: ./mvnw -B -ntp dependency-check:check -DnvdApiKey="$NVD_API_KEY"

      # Saved separately (not by actions/cache's post step) so the database is kept even when the scan
      # fails the build on a vulnerability; skipped on cancel, where the download may be incomplete
      - name: Save vulnerability database
        if: "!cancelled() && env.NVD_API_KEY != '' && steps.scan.conclusion != 'skipped'"
        uses: actions/cache/save@v6
        with:
          path: ~/.dependency-check/data
          key: dependency-check-db-${{ github.run_id }}

      - name: Upload findings to the Security tab
        if: always() && env.NVD_API_KEY != '' && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

      - name: Upload HTML report
        if: always() && env.NVD_API_KEY != '' && hashFiles('target/dependency-check-report.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  npm-audit:
    name: npm audit (widget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # Only what ships in store-widget.js (React); the build and lint tools never reach a browser.
      # Reads the lockfile only, nothing is installed
      - name: Audit runtime dependencies (fails on moderate and above)
        run: npm audit --omit=dev --audit-level=moderate
